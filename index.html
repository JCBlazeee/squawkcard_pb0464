<style>/* Midnight: dark and bold. A large rounded photo, light type, mint accents. On a computer: photo left, details right. */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.55;color:#eef4f0;background:#0c1411;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.card{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:16px 16px max(16px,env(safe-area-inset-bottom))}
.hero{position:relative;flex:1;min-height:300px;max-height:62vh;border-radius:26px;overflow:hidden;background:linear-gradient(150deg,#1c3227 0%,#0f1d17 100%)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center var(--photo-focus,22%)}
.initials{position:absolute;inset:0;display:grid;place-items:center;font-family:"Outfit",system-ui,sans-serif;font-weight:600;font-size:110px;color:#8fd3ad;letter-spacing:.04em}
.fade{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(0deg,rgba(12,20,17,.75),rgba(12,20,17,0))}
.logo-shade{position:absolute;left:0;right:0;top:0;height:calc(var(--logo-top,24px) + var(--logo-height,40px) + 90px)}
[data-logo-shade="black"] .logo-shade{background:linear-gradient(180deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,0) 100%)}
[data-logo-shade="white"] .logo-shade{background:linear-gradient(180deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 100%)}
.logo{position:absolute;left:15%;width:70%;top:var(--logo-top,24px);height:var(--logo-height,40px);display:flex;justify-content:center}
.logo img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain}
.who{padding:22px 6px 4px}
.eid{font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8fd3ad}
.name{margin-top:4px;font-family:"Outfit",system-ui,sans-serif;font-weight:600;font-size:clamp(26px,8.6vw,34px);line-height:1.1;color:#fff;overflow-wrap:anywhere}
.role{margin-top:4px;font-weight:500;font-size:15px;color:#b6c4bc}
.actions:not(:has(a)){display:none}
.actions{display:grid;gap:10px;padding-top:18px}
.tiles{display:flex;gap:10px}
.tiles:not(:has(a)){display:none}
.tile{flex:1;min-width:0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:16px;background:#16221d;border:1px solid #263a30;
  font-weight:600;font-size:13px;color:#dfe9e3;white-space:nowrap;transition:background .15s}
.tile:hover,.tile:active{background:#1d2d26}
.tile svg{width:22px;height:22px;fill:none;stroke:#8fd3ad;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.save{height:52px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;background:#8fd3ad;color:#0c1411;font-weight:600;font-size:15px;transition:filter .15s}
.save:hover,.save:active{filter:brightness(1.08)}
.save svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Computer: photo left, details right */

  .hero{grid-row:1/3;max-height:none;min-height:0}
  .who{align-self:end;padding:0 24px 0 0}
  .name{font-size:44px}
  .role{font-size:17px}
  .actions{padding:26px 24px 20px 0}
}</style>

<style>/* Squawk's own styles on every Squawk Card Page, after the template's. Names starting sq- are reserved for these. */
.sq-modal{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:24px;background:rgba(16,24,20,.32);

  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transform:translateY(12px) scale(.96);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sq-modal.on .sq-box{transform:none}

.sq-box button:focus-visible{outline:3px solid #9bd3ae;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.sq-modal,.sq-box{transition:none}}

<script type="application/json" id="squawk-page">{"preview":false,"vcf":"suraj-jacob-chacko.vcf","contact":{"name":"Suraj Jacob Chacko","phone":"+917010149651","email":"suraj.schilujohn@precisionit.co.in","company":"Precision Biometric India Pvt. Ltd","title":"Product Manager"}}</script>
<script>/* Squawk Card Page script. Plain JavaScript, no dependencies. Templates never add script: this is the only script on the page. */
(function () {
  "use strict";
  var holder = document.getElementById("squawk-page");
  if (!holder) return;
  var data;
  try { data = JSON.parse(holder.textContent); } catch (e) { return; }
  var contact = data.contact || {};
  var links = function (slot) { return Array.prototype.slice.call(document.querySelectorAll('a[data-squawk="' + slot + '"]')); };

  if (data.preview) {
    /* The preview inherits the Creator's security policy, which accepts no new <style> blocks: apply the template's CSS and
       settings through the CSS object model instead. */
    try {
      var sheets = [data.css || "", data.settings || ""].map(function (text) { var s = new CSSStyleSheet(); s.replaceSync(text); return s; });
      document.adoptedStyleSheets = sheets;
    } catch (e) { /* very old browser: the preview shows without the template's styles */ }

    /* Call, Email and Save open a pop-up over a blurred page saying what they do. LinkedIn opens as normal. */
    var modal = document.createElement("div"), box = document.createElement("div"), tag = document.createElement("small"),
        head = document.createElement("h3"), msg = document.createElement("p"), ok = document.createElement("button"), back = null;
    modal.className = "sq-modal"; modal.setAttribute("role", "dialog"); modal.setAttribute("aria-modal", "true"); modal.setAttribute("aria-labelledby", "sq-modal-title");
    box.className = "sq-box"; head.id = "sq-modal-title"; tag.textContent = "Preview"; ok.type = "button"; ok.textContent = "OK";
    box.appendChild(tag); box.appendChild(head); box.appendChild(msg); box.appendChild(ok); modal.appendChild(box); document.body.appendChild(modal);
    var close = function () { modal.classList.remove("on"); if (back) back.focus(); };
    var say = function (title, text, from) { head.textContent = title; msg.textContent = text; back = from; modal.classList.add("on"); ok.focus(); };
    ok.addEventListener("click", close);
    modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
    addEventListener("keydown", function (e) { if (e.key === "Escape" && modal.classList.contains("on")) close(); });
    var explain = { call: ["Call me", "On a phone, this button calls " + contact.phone + "."],
                    email: ["Email me", "On the real page, this button starts an email to " + contact.email + "."],
                    save: ["Save my contact", "On the real page, this button saves " + contact.name + " to the phone's contacts."] };
    ["call", "email", "save"].forEach(function (slot) {
      links(slot).forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); say(explain[slot][0], explain[slot][1], a); }); });
    });
    return;
  }

  /* Save contact. iPhone and iPad: open the contact file itself, and Safari shows the card with Create New Contact.
     Android: open the phone's own Create contact screen, filled in, falling back to the contact file if that is not possible.
     Computers: download the contact file. */
  if (!data.vcf) return;
  var ua = navigator.userAgent || "";
  var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var intent = function (fileUrl) {
    var e = encodeURIComponent, x = "intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;";
    if (contact.name) x += "S.name=" + e(contact.name) + ";";
    if (contact.phone) x += "S.phone=" + e(contact.phone) + ";";
    if (contact.email) x += "S.email=" + e(contact.email) + ";";
    if (contact.company) x += "S.company=" + e(contact.company) + ";";
    if (contact.title) x += "S.job_title=" + e(contact.title) + ";";
    return x + "S.browser_fallback_url=" + e(fileUrl) + ";end";
  };
  links("save").forEach(function (a) {
    if (ios) a.removeAttribute("download");
    else if (android) { a.removeAttribute("download"); a.setAttribute("href", intent(new URL(data.vcf, location.href).href)); }
  });
})();
</script>
